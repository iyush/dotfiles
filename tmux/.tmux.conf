unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

set -g default-terminal "xterm-256color"

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left '[#{b:pane_current_path}]'
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
set -g mouse on
setw -g mode-keys vi

# Copy mouse selection to the system clipboard and keep copy-mode open,
# preventing tmux from jumping back to the bottom after highlighting.
set -g @copy_to_clipboard "sh -c 'if command -v wl-copy >/dev/null 2>&1 && [ -n \"$(printenv WAYLAND_DISPLAY)\" ]; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; fi'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "#{@copy_to_clipboard}"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "#{@copy_to_clipboard}"
set -s escape-time 0
set -g status-interval 0
set -g automatic-rename-format '#{b:pane_current_command}'

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

set-option -g history-limit 5000

bind-key v run-shell "tmux neww ws code ~/Desktop/src"
bind-key g run-shell "tmux neww ws git ~/Desktop/src"
bind-key h run-shell "tmux neww github-go.sh volueinsight"
bind-key r source-file ~/.tmux.conf
bind-key -r f run-shell "tmux neww tmux-sessionizer"
